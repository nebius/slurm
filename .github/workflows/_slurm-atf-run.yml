name: Internal Slurm ATF run

on:
  workflow_call:
    inputs:
      run_kind:
        description: baseline or candidate
        required: true
        type: string
      release_line:
        description: Slurm release line, for example 26.05
        required: true
        type: string
      tests_ref:
        description: Exact ref containing the common tests
        required: true
        type: string
      image_id:
        required: false
        default: computeimage-e00sphs75y9ej9nw9j
        type: string
      atf_profile:
        required: false
        default: generic
        type: string
      nebius_cli_profile:
        required: false
        default: default
        type: string
      keep_vm_on_failure:
        required: false
        default: false
        type: boolean
    outputs:
      artifact_name:
        description: Complete Actions artifact for this run
        value: ${{ jobs.run.outputs.artifact_name }}
      source_commit:
        description: Exact Slurm source commit that was built
        value: ${{ jobs.run.outputs.source_commit }}
      tests_commit:
        description: Exact commit supplying the common tests
        value: ${{ jobs.run.outputs.tests_commit }}
      infra_commit:
        description: Exact slurm-deb-packages ATF infrastructure commit
        value: ${{ jobs.run.outputs.infra_commit }}
      vm_shape:
        description: Effective Nebius VM shape
        value: ${{ jobs.run.outputs.vm_shape }}

permissions:
  contents: read

jobs:
  run:
    name: Full Python ATF / ${{ inputs.run_kind }}
    runs-on: ubuntu-24.04
    environment: e2e
    timeout-minutes: 1440
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      source_commit: ${{ steps.checkout_metadata.outputs.source_commit }}
      tests_commit: ${{ steps.checkout_metadata.outputs.tests_commit }}
      infra_commit: ${{ steps.checkout_metadata.outputs.infra_commit }}
      vm_shape: ${{ steps.profile.outputs.vm_shape }}
    env:
      ATF_CLOUD_PROFILE: ${{ vars.SLURM_ATF_PROFILE }}
      NEBIUS_CLI_VERSION: 0.12.253
      NEBIUS_CLI_PROFILE: ${{ inputs.nebius_cli_profile }}
      NEBIUS_VM_IMAGE_ID: ${{ inputs.image_id }}
      NEBIUS_VM_NAME: slurm-atf-${{ github.run_id }}-${{ github.run_attempt }}
      ATF_INFRA_COMMIT: d6c8f15e431d41fc03eb87d276c02c9e485e6ac9

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned common tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tests_ref }}
          path: tests
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned ATF infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nebius/slurm-deb-packages
          ref: d6c8f15e431d41fc03eb87d276c02c9e485e6ac9
          path: external-infra
          fetch-depth: 1
          persist-credentials: false

      - id: checkout_metadata
        name: Pin all checkout identities
        run: |
          set -euo pipefail
          source_commit="$(git -C source rev-parse HEAD)"
          tests_commit="$(git -C tests rev-parse HEAD)"
          infra_commit="$(git -C external-infra rev-parse HEAD)"
          test "${infra_commit}" = "${ATF_INFRA_COMMIT}"
          [[ "${source_commit}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${tests_commit}" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "source_commit=${source_commit}"
            echo "tests_commit=${tests_commit}"
            echo "infra_commit=${infra_commit}"
          } >>"${GITHUB_OUTPUT}"

      - name: Adapt pinned infrastructure to the immutable image
        run: |
          set -euo pipefail
          configure_script=external-infra/slurm-atf/infra/configure-atf.sh
          expected='sudo "${root}/venv/bin/pip" install -r "${script_dir}/requirements.lock"'
          grep -Fxq "${expected}" "${configure_script}"
          sed -i \
            's|sudo "${root}/venv/bin/pip" install -r "${script_dir}/requirements.lock"|sudo "${root}/venv/bin/pip" check|' \
            "${configure_script}"

      - name: Install yq
        uses: frenck/action-setup-yq@c4b5be8b4a215c536a41d436757d9feb92836d4f # v1.0.2
        with:
          version: v4.44.6

      - id: profile
        name: Resolve Nebius VM profile
        run: |
          set -euo pipefail
          [[ "${{ inputs.run_kind }}" == baseline || "${{ inputs.run_kind }}" == candidate ]]
          [[ "${{ inputs.release_line }}" =~ ^[0-9]+\.[0-9]+$ ]]
          [[ "${{ inputs.atf_profile }}" == generic || "${{ inputs.atf_profile }}" == b200 ]]
          if [[ -z "${ATF_CLOUD_PROFILE}" ]]; then
            echo "::error::GitHub variable SLURM_ATF_PROFILE is empty"
            exit 1
          fi
          [[ "${NEBIUS_CLI_PROFILE}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]

          value() {
            yq -er "$1" <<<"${ATF_CLOUD_PROFILE}"
          }
          emit() {
            local name="$1"
            local data="$2"
            [[ -n "${data}" && "${data}" != *$'\n'* ]]
            printf '%s=%s\n' "${name}" "${data}" >>"${GITHUB_ENV}"
          }

          project_id="$(value '.nebius_project_id')"
          subnet_id="$(value '.slurm_atf.subnet_id')"
          platform="$(value '.slurm_atf.platform')"
          preset="$(value '.slurm_atf.preset')"
          boot_disk_gib="$(value '.slurm_atf.boot_disk_gib // 512')"
          boot_disk_type="$(value '.slurm_atf.boot_disk_type // "network_ssd"')"
          ssh_user="$(value '.slurm_atf.ssh_user // "slurm-atf-ci"')"
          security_group_id="$(
            yq -r '.slurm_atf.security_group_id // ""' \
              <<<"${ATF_CLOUD_PROFILE}"
          )"

          [[ "${boot_disk_gib}" =~ ^[1-9][0-9]*$ ]]
          [[ "${ssh_user}" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          vm_shape="${platform}/${preset}/${boot_disk_gib}GiB-${boot_disk_type}"

          emit NEBIUS_PROJECT_ID "${project_id}"
          emit NEBIUS_SUBNET_ID "${subnet_id}"
          emit NEBIUS_VM_PLATFORM "${platform}"
          emit NEBIUS_VM_PRESET "${preset}"
          emit NEBIUS_VM_BOOT_DISK_GIB "${boot_disk_gib}"
          emit NEBIUS_VM_BOOT_DISK_TYPE "${boot_disk_type}"
          emit SLURM_ATF_SSH_USER "${ssh_user}"
          [[ "${security_group_id}" != *$'\n'* ]]
          printf 'NEBIUS_SECURITY_GROUP_ID=%s\n' "${security_group_id}" \
            >>"${GITHUB_ENV}"
          echo "vm_shape=${vm_shape}" >>"${GITHUB_OUTPUT}"

          {
            echo "### Full Slurm ATF run"
            echo
            echo "- Kind: \`${{ inputs.run_kind }}\`"
            echo "- Release line: \`${{ inputs.release_line }}\`"
            echo "- Source: \`${{ steps.checkout_metadata.outputs.source_commit }}\`"
            echo "- Tests: \`${{ steps.checkout_metadata.outputs.tests_commit }}\`"
            echo "- Infrastructure: \`${ATF_INFRA_COMMIT}\`"
            echo "- Image: \`${NEBIUS_VM_IMAGE_ID}\`"
            echo "- Shape: \`${vm_shape}\`"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Install Nebius CLI
        env:
          NEBIUS_INSTALL_FOLDER: ${{ github.workspace }}/bin
        run: |
          set -euo pipefail
          mkdir -p "${NEBIUS_INSTALL_FOLDER}"
          curl -sSL https://storage.eu-north1.nebius.cloud/cli/install.sh | bash
          echo "${NEBIUS_INSTALL_FOLDER}" >>"${GITHUB_PATH}"

      - name: Configure Nebius CLI
        env:
          NEBIUS_CLI_CONFIG: ${{ vars.NEBIUS_CLI_CONFIG }}
          NEBIUS_PRIVATE_KEY: ${{ secrets.NEBIUS_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEBIUS_CLI_CONFIG}"
          test -n "${NEBIUS_PRIVATE_KEY}"
          mkdir -p "${HOME}/.nebius"
          printf '%s\n' "${NEBIUS_CLI_CONFIG}" >"${HOME}/.nebius/config.yaml"
          yq -e '.profiles[strenv(NEBIUS_CLI_PROFILE)] != null' \
            "${HOME}/.nebius/config.yaml" >/dev/null
          yq -i \
            '.profiles[strenv(NEBIUS_CLI_PROFILE)]["private-key"] = strenv(NEBIUS_PRIVATE_KEY)' \
            "${HOME}/.nebius/config.yaml"
          chmod 600 "${HOME}/.nebius/config.yaml"
          nebius version --full

      - name: Prepare SSH identities
        env:
          DEBUG_SSH_PUBLIC_KEYS: ${{ secrets.SLURM_ATF_DEBUG_SSH_PUBLIC_KEYS }}
          SSH_PRIVATE_KEY: ${{ secrets.SLURM_ATF_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          private_key_file="${RUNNER_TEMP}/slurm-atf-ssh-key"
          public_key_file="${RUNNER_TEMP}/slurm-atf-ssh-key.pub"
          debug_keys_file="${RUNNER_TEMP}/slurm-atf-debug-ssh-keys.pub"
          known_hosts_file="${RUNNER_TEMP}/slurm-atf-known-hosts"
          printf '%s\n' "${SSH_PRIVATE_KEY}" | tr -d '\r' >"${private_key_file}"
          chmod 600 "${private_key_file}"
          ssh-keygen -y -P "" -f "${private_key_file}" >"${public_key_file}"
          printf '%s\n' "${DEBUG_SSH_PUBLIC_KEYS}" | tr -d '\r' >"${debug_keys_file}"
          chmod 600 "${debug_keys_file}"
          touch "${known_hosts_file}"
          chmod 600 "${known_hosts_file}"
          {
            echo "SLURM_ATF_SSH_PRIVATE_KEY_FILE=${private_key_file}"
            echo "SLURM_ATF_SSH_PUBLIC_KEY_FILE=${public_key_file}"
            echo "SLURM_ATF_DEBUG_SSH_PUBLIC_KEYS_FILE=${debug_keys_file}"
            echo "SLURM_ATF_SSH_KNOWN_HOSTS_FILE=${known_hosts_file}"
          } >>"${GITHUB_ENV}"

      - id: create_vm
        name: Create disposable Nebius VM
        run: |
          set -euo pipefail
          instance_json="$(tests/nebius/ci/cloud/nebius/create-vm.sh)"
          vm_id="$(jq -er '.metadata.id' <<<"${instance_json}")"
          echo "NEBIUS_VM_ID=${vm_id}" >>"${GITHUB_ENV}"
          echo "vm_id=${vm_id}" >>"${GITHUB_OUTPUT}"

      - id: wait_vm
        name: Wait for cloud-init and SSH
        run: |
          set -euo pipefail
          public_ip="$(tests/nebius/ci/cloud/nebius/wait-for-ssh.sh)"
          echo "NEBIUS_VM_PUBLIC_IP=${public_ip}" >>"${GITHUB_ENV}"
          echo "public_ip=${public_ip}" >>"${GITHUB_OUTPUT}"
          {
            echo "- VM ID: \`${NEBIUS_VM_ID}\`"
            echo "- Public IP: \`${public_ip}\`"
            echo "- SSH: \`ssh ${SLURM_ATF_SSH_USER}@${public_ip}\`"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Copy source, tests, and infrastructure to the VM
        run: |
          set -euo pipefail
          remote_root="/home/${SLURM_ATF_SSH_USER}/slurm-atf"
          for directory in source tests external-infra; do
            tar --exclude='.git' -C "${directory}" -czf - . |
              ssh \
                -i "${SLURM_ATF_SSH_PRIVATE_KEY_FILE}" \
                -o BatchMode=yes \
                -o ServerAliveInterval=30 \
                -o ServerAliveCountMax=6 \
                -o StrictHostKeyChecking=yes \
                -o "UserKnownHostsFile=${SLURM_ATF_SSH_KNOWN_HOSTS_FILE}" \
                "${SLURM_ATF_SSH_USER}@${NEBIUS_VM_PUBLIC_IP}" \
                "mkdir -p '${remote_root}/${directory}' && tar -xzf - -C '${remote_root}/${directory}'"
          done

      - id: remote_test
        name: Build candidate and run the full Python ATF suite
        continue-on-error: true
        run: |
          set -euo pipefail
          remote_root="/home/${SLURM_ATF_SSH_USER}/slurm-atf"
          run_id="${{ inputs.run_kind }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh \
            -i "${SLURM_ATF_SSH_PRIVATE_KEY_FILE}" \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=${SLURM_ATF_SSH_KNOWN_HOSTS_FILE}" \
            "${SLURM_ATF_SSH_USER}@${NEBIUS_VM_PUBLIC_IP}" \
            bash -s -- \
              "${remote_root}" \
              "${run_id}" \
              "${{ inputs.release_line }}" \
              "${{ steps.checkout_metadata.outputs.source_commit }}" \
              "${{ steps.checkout_metadata.outputs.tests_commit }}" \
              "${{ inputs.atf_profile }}" <<'REMOTE'
          set -euo pipefail
          root="$1"
          run_id="$2"
          release_line="$3"
          source_commit="$4"
          tests_commit="$5"
          atf_profile="$6"
          source_dir="${root}/source"
          tests_dir="${root}/tests"
          infra_dir="${root}/external-infra/slurm-atf/infra"
          build_dir="${root}/build"
          output_dir="${root}/result"
          mkdir -p "${output_dir}"
          set +e
          "${tests_dir}/nebius/ci/atf/run-full-suite.sh" \
            "${source_dir}" \
            "${tests_dir}" \
            "${infra_dir}" \
            "${build_dir}" \
            "${output_dir}" \
            "${run_id}" \
            "${release_line}" \
            "${source_commit}" \
            "${tests_commit}" \
            "${atf_profile}" \
            2>&1 | tee "${root}/orchestration.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "${status}"
          REMOTE

      - if: always() && steps.wait_vm.outcome == 'success'
        name: Collect complete ATF evidence
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p atf-result
          remote_root="/home/${SLURM_ATF_SSH_USER}/slurm-atf"
          scp \
            -i "${SLURM_ATF_SSH_PRIVATE_KEY_FILE}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=${SLURM_ATF_SSH_KNOWN_HOSTS_FILE}" \
            -r "${SLURM_ATF_SSH_USER}@${NEBIUS_VM_PUBLIC_IP}:${remote_root}/result/." \
            atf-result/ || true
          scp \
            -i "${SLURM_ATF_SSH_PRIVATE_KEY_FILE}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=${SLURM_ATF_SSH_KNOWN_HOSTS_FILE}" \
            "${SLURM_ATF_SSH_USER}@${NEBIUS_VM_PUBLIC_IP}:${remote_root}/orchestration.log" \
            atf-result/orchestration.log || true
          nebius compute instance get \
            --profile "${NEBIUS_CLI_PROFILE}" \
            --format json \
            --id "${NEBIUS_VM_ID}" >atf-result/nebius-instance-final.json || true

      - if: always() && steps.create_vm.outcome != 'skipped'
        name: Delete disposable Nebius VM
        env:
          KEEP_VM_ON_FAILURE: ${{ inputs.keep_vm_on_failure }}
          REMOTE_TEST_OUTCOME: ${{ steps.remote_test.outcome }}
        run: |
          set -euo pipefail
          if [[ "${KEEP_VM_ON_FAILURE}" == true && "${REMOTE_TEST_OUTCOME}" != success ]]; then
            {
              echo
              echo "> [!WARNING]"
              echo "> VM kept because the ATF run failed and keep_vm_on_failure=true."
              echo "> Delete \`${NEBIUS_VM_NAME}\` manually after debugging."
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          tests/nebius/ci/cloud/nebius/delete-vm.sh

      - id: metadata
        if: always() && steps.remote_test.outcome == 'success'
        name: Record reproducibility metadata
        run: |
          set -euo pipefail
          test -s atf-result/junit.xml
          test -s atf-result/run-manifest.json
          pytest_status="$(<atf-result/pytest-exit-status)"
          [[ "${pytest_status}" =~ ^[0-9]+$ ]]
          junit_sha256="$(sha256sum atf-result/junit.xml | awk '{print $1}')"
          artifact_name="slurm-atf-${{ inputs.run_kind }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          jq -n \
            --arg kind "${{ inputs.run_kind }}" \
            --arg release_line "${{ inputs.release_line }}" \
            --arg source_ref "${GITHUB_REF}" \
            --arg source_commit "${{ steps.checkout_metadata.outputs.source_commit }}" \
            --arg tests_commit "${{ steps.checkout_metadata.outputs.tests_commit }}" \
            --arg infra_repository nebius/slurm-deb-packages \
            --arg infra_commit "${ATF_INFRA_COMMIT}" \
            --arg image_id "${NEBIUS_VM_IMAGE_ID}" \
            --arg vm_shape "${{ steps.profile.outputs.vm_shape }}" \
            --arg atf_profile "${{ inputs.atf_profile }}" \
            --arg junit_sha256 "${junit_sha256}" \
            --arg pytest_status "${pytest_status}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              schema: 1,
              kind: $kind,
              release_line: $release_line,
              source: {ref: $source_ref, commit: $source_commit},
              tests: {commit: $tests_commit},
              infrastructure: {repository: $infra_repository, commit: $infra_commit},
              vm: {image_id: $image_id, shape: $vm_shape, atf_profile: $atf_profile},
              result: {junit_sha256: $junit_sha256, pytest_exit_status: ($pytest_status | tonumber)},
              workflow: {run_id: $run_id, run_attempt: $run_attempt, run_url: $run_url}
            }' >atf-result/run-metadata.json

          echo "artifact_name=${artifact_name}" >>"${GITHUB_OUTPUT}"

      - if: always()
        name: Upload complete ATF evidence
        uses: actions/upload-artifact@v7
        with:
          name: slurm-atf-${{ inputs.run_kind }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: atf-result/
          if-no-files-found: error
          retention-days: 30

      - if: always() && (steps.remote_test.outcome != 'success' || steps.metadata.outcome != 'success')
        name: Fail after evidence collection and cleanup
        run: |
          echo "Full Slurm ATF execution did not produce valid evidence" >&2
          exit 1
