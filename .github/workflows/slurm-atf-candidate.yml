name: Slurm ATF patch comparison

on:
  workflow_dispatch:
    inputs:
      release_line:
        description: Slurm release line, for example 26.05
        required: true
        default: "26.05"
        type: string
      baseline_tag:
        description: Immutable baseline tag; empty reads the release pointer file
        required: false
        default: ""
        type: string
      nebius_cli_profile:
        description: Profile name inside NEBIUS_CLI_CONFIG
        required: true
        default: default
        type: string
      keep_vm_on_failure:
        description: Keep the VM after an infrastructure failure for SSH debugging
        required: true
        default: false
        type: boolean
  pull_request:
    branches:
      - nebius/**

permissions:
  contents: read

concurrency:
  group: slurm-atf-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve the immutable baseline
    runs-on: ubuntu-24.04
    outputs:
      baseline_tag: ${{ steps.baseline.outputs.baseline_tag }}
      release_line: ${{ steps.baseline.outputs.release_line }}
      tests_commit: ${{ steps.baseline.outputs.tests_commit }}
      cpu_image_id: ${{ steps.baseline.outputs.cpu_image_id }}
      gpu_image_id: ${{ steps.baseline.outputs.gpu_image_id }}
      cpu_vm_shape: ${{ steps.baseline.outputs.cpu_vm_shape }}
      gpu_vm_shape: ${{ steps.baseline.outputs.gpu_vm_shape }}
      comparison_required: ${{ steps.baseline.outputs.comparison_required }}
    steps:
      - name: Checkout the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: github.event_name == 'pull_request'
        name: Checkout the target release baseline pointer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: target-release
          fetch-depth: 1
          persist-credentials: false

      - id: baseline
        name: Validate the selected baseline
        env:
          DISPATCH_BASELINE_TAG: ${{ inputs.baseline_tag }}
          DISPATCH_RELEASE_LINE: ${{ inputs.release_line }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$*" >&2
            exit 1
          }
          comparison_required=true
          branch_description=""
          if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
            release_line="${GITHUB_BASE_REF#nebius/}"
            if [[ "${release_line}" == "${GITHUB_BASE_REF}" ]]; then
              fail "Target branch must match nebius/<release>"
            fi
            if [[ ! "${GITHUB_HEAD_REF}" =~ ^([0-9]+\.[0-9]+)/patch/([A-Za-z0-9][A-Za-z0-9._-]*)$ ]]; then
              fail "Patch branch must match <release>/patch/<description>"
            fi
            if [[ "${BASH_REMATCH[1]}" != "${release_line}" ]]; then
              fail "Patch branch release ${BASH_REMATCH[1]} does not match target ${release_line}"
            fi
            branch_description="${BASH_REMATCH[2]}"
          else
            release_line="${DISPATCH_RELEASE_LINE}"
          fi
          [[ "${release_line}" =~ ^[0-9]+\.[0-9]+$ ]]

          pointer="nebius/ci/atf/baselines/${release_line}.txt"
          baseline_tag="${DISPATCH_BASELINE_TAG}"
          if [[ -z "${baseline_tag}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
              if [[ -s "target-release/${pointer}" ]]; then
                baseline_tag="$(<"target-release/${pointer}")"
                if [[ ! -s "${pointer}" ]]; then
                  fail "Candidate is missing the target release baseline pointer ${pointer}"
                fi
                if [[ "$(<"${pointer}")" != "${baseline_tag}" ]]; then
                  fail "A patch cannot replace the target release baseline pointer"
                fi
              else
                if [[ ! "${branch_description}" =~ ^NB-0001-[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
                  fail "Only NB-0001 may bootstrap a missing release baseline pointer"
                fi
                if [[ ! -s "${pointer}" ]]; then
                  fail "NB-0001 must add ${pointer} before it can merge"
                fi
                baseline_tag="$(<"${pointer}")"
                comparison_required=false
              fi
            else
              if [[ ! -s "${pointer}" ]]; then
                fail "Missing release baseline pointer ${pointer}"
              fi
              baseline_tag="$(<"${pointer}")"
            fi
          fi
          [[ "${baseline_tag}" =~ ^slurm-atf-baseline-[0-9]+\.[0-9]+-[0-9a-f]{64}$ ]]
          test "${baseline_tag%-*}" = "slurm-atf-baseline-${release_line}"

          mkdir -p baseline-assets baseline-evidence
          gh release download "${baseline_tag}" \
            --pattern "${baseline_tag}.tar.gz" \
            --pattern "${baseline_tag}.tar.gz.sha256" \
            --pattern "${baseline_tag}.json" \
            --dir baseline-assets
          (
            cd baseline-assets
            sha256sum -c "${baseline_tag}.tar.gz.sha256"
          )
          descriptor="baseline-assets/${baseline_tag}.json"
          baseline_key="${baseline_tag##*-}"
          test "$(jq -er '.release_tag' "${descriptor}")" = "${baseline_tag}"
          test "$(jq -er '.baseline_key' "${descriptor}")" = "${baseline_key}"
          test "$(jq -er '.run.release_line' "${descriptor}")" = "${release_line}"
          test "$(jq -er '.archive' "${descriptor}")" = "${baseline_tag}.tar.gz"
          test "$(jq -er '.archive_sha256' "${descriptor}")" = \
            "$(awk '{print $1}' "baseline-assets/${baseline_tag}.tar.gz.sha256")"
          test "$(jq -cS '.identity' "${descriptor}" | sha256sum | awk '{print $1}')" = \
            "${baseline_key}"
          tar -xzf "baseline-assets/${baseline_tag}.tar.gz" -C baseline-evidence

          diff -u \
            <(jq -S '.run' "${descriptor}") \
            <(jq -S . baseline-evidence/run-metadata.json)

          baseline_source="$(jq -er '.source.commit' baseline-evidence/run-metadata.json)"
          tests_commit="$(jq -er '.tests.commit' baseline-evidence/run-metadata.json)"
          upstream_commit="$(jq -er '.upstream_commit' "${descriptor}")"
          test "$(jq -er '.vm.topology' baseline-evidence/run-metadata.json)" = \
            4cpu+1gpu
          cpu_image_id="$(jq -er '.vm.cpu.image_id' baseline-evidence/run-metadata.json)"
          gpu_image_id="$(jq -er '.vm.gpu.image_id' baseline-evidence/run-metadata.json)"
          cpu_vm_shape="$(jq -er '.vm.cpu.shape' baseline-evidence/run-metadata.json)"
          gpu_vm_shape="$(jq -er '.vm.gpu.shape' baseline-evidence/run-metadata.json)"
          [[ "${baseline_source}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${tests_commit}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${upstream_commit}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${cpu_image_id}" =~ ^computeimage-[a-z0-9]+$ ]]
          [[ "${gpu_image_id}" =~ ^computeimage-[a-z0-9]+$ ]]
          test "$(jq -er '.vm.cpu.count' baseline-evidence/run-metadata.json)" = 4
          test "$(jq -er '.vm.cpu.atf_profile' baseline-evidence/run-metadata.json)" = generic
          test "$(jq -er '.vm.gpu.count' baseline-evidence/run-metadata.json)" = 1
          test "$(jq -er '.vm.gpu.atf_profile' baseline-evidence/run-metadata.json)" = h200
          [[ "${cpu_vm_shape}" != *$'\n'* && -n "${cpu_vm_shape}" ]]
          [[ "${gpu_vm_shape}" != *$'\n'* && -n "${gpu_vm_shape}" ]]
          test "$(jq -er '.kind' baseline-evidence/run-metadata.json)" = baseline
          test "$(jq -er '.result.junit_sha256' baseline-evidence/run-metadata.json)" = \
            "$(sha256sum baseline-evidence/junit.xml | awk '{print $1}')"
          git merge-base --is-ancestor "${upstream_commit}" HEAD
          if [[ "${comparison_required}" == false ]]; then
            git merge-base --is-ancestor "${baseline_source}" HEAD
          fi

          {
            echo "baseline_tag=${baseline_tag}"
            echo "release_line=${release_line}"
            echo "tests_commit=${tests_commit}"
            echo "cpu_image_id=${cpu_image_id}"
            echo "gpu_image_id=${gpu_image_id}"
            echo "cpu_vm_shape=${cpu_vm_shape}"
            echo "gpu_vm_shape=${gpu_vm_shape}"
            echo "comparison_required=${comparison_required}"
          } >>"${GITHUB_OUTPUT}"
          {
            echo "### Patch comparison input"
            echo
            echo "- Baseline: \`${baseline_tag}\`"
            echo "- Clean upstream: \`${upstream_commit}\`"
            echo "- Baseline source: \`${baseline_source}\`"
            echo "- Common tests: \`${tests_commit}\`"
            echo "- CPU shards: \`4 x ${cpu_vm_shape}\` using \`${cpu_image_id}\`"
            echo "- GPU shard: \`1 x ${gpu_vm_shape}\` using \`${gpu_image_id}\`"
            echo "- Candidate: \`$(git rev-parse HEAD)\`"
            echo "- Full comparison required: \`${comparison_required}\`"
          } >>"${GITHUB_STEP_SUMMARY}"

  run:
    name: Run the candidate suite
    needs: prepare
    if: needs.prepare.outputs.comparison_required == 'true'
    uses: ./.github/workflows/_slurm-atf-sharded-run.yml
    with:
      run_kind: candidate
      release_line: ${{ needs.prepare.outputs.release_line }}
      tests_ref: ${{ needs.prepare.outputs.tests_commit }}
      cpu_image_id: ${{ needs.prepare.outputs.cpu_image_id }}
      gpu_image_id: ${{ needs.prepare.outputs.gpu_image_id }}
      expected_cpu_vm_shape: ${{ needs.prepare.outputs.cpu_vm_shape }}
      expected_gpu_vm_shape: ${{ needs.prepare.outputs.gpu_vm_shape }}
      nebius_cli_profile: ${{ inputs.nebius_cli_profile || 'default' }}
      keep_vm_on_failure: ${{ inputs.keep_vm_on_failure || false }}
    secrets: inherit

  compare:
    name: Compare every testcase with vanilla
    needs:
      - prepare
      - run
    if: needs.prepare.outputs.comparison_required == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the trusted comparison tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download candidate evidence
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.run.outputs.artifact_name }}
          path: candidate-evidence

      - name: Download validated patch-test evidence
        uses: actions/download-artifact@v8
        with:
          name: slurm-atf-patch-tests-${{ github.run_id }}-${{ github.run_attempt }}-gpu
          path: patch-evidence

      - id: comparison
        name: Validate provenance and compare JUnit reports
        continue-on-error: true
        env:
          BASELINE_TAG: ${{ needs.prepare.outputs.baseline_tag }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_LINE: ${{ needs.prepare.outputs.release_line }}
        run: |
          set -euo pipefail
          mkdir -p baseline-assets baseline-evidence comparison
          gh release download "${BASELINE_TAG}" \
            --pattern "${BASELINE_TAG}.tar.gz" \
            --pattern "${BASELINE_TAG}.tar.gz.sha256" \
            --pattern "${BASELINE_TAG}.json" \
            --dir baseline-assets
          (
            cd baseline-assets
            sha256sum -c "${BASELINE_TAG}.tar.gz.sha256"
          )
          descriptor="baseline-assets/${BASELINE_TAG}.json"
          test "$(jq -er '.release_tag' "${descriptor}")" = "${BASELINE_TAG}"
          test "$(jq -er '.archive_sha256' "${descriptor}")" = \
            "$(awk '{print $1}' "baseline-assets/${BASELINE_TAG}.tar.gz.sha256")"
          tar -xzf "baseline-assets/${BASELINE_TAG}.tar.gz" -C baseline-evidence

          diff -u \
            <(jq -S '.run' "${descriptor}") \
            <(jq -S . baseline-evidence/run-metadata.json)

          baseline=baseline-evidence/run-metadata.json
          candidate=candidate-evidence/run-metadata.json
          test "$(jq -er '.kind' "${baseline}")" = baseline
          test "$(jq -er '.kind' "${candidate}")" = candidate
          test "$(jq -er '.release_line' "${baseline}")" = "${RELEASE_LINE}"
          test "$(jq -er '.release_line' "${candidate}")" = "${RELEASE_LINE}"
          test "$(jq -er '.source.commit' "${candidate}")" = \
            "${{ needs.run.outputs.source_commit }}"
          for metadata in "${baseline}" "${candidate}"; do
            pytest_status="$(jq -er '.result.pytest_exit_status' "${metadata}")"
            [[ "${pytest_status}" == 0 || "${pytest_status}" == 1 ]]
          done
          for query in \
            '.tests.commit' \
            '.infrastructure.repository' \
            '.infrastructure.commit' \
            '.vm' \
            '.sharding'; do
            test "$(jq -er "${query}" "${baseline}")" = \
              "$(jq -er "${query}" "${candidate}")"
          done
          test "$(jq -er '.result.junit_sha256' "${baseline}")" = \
            "$(sha256sum baseline-evidence/junit.xml | awk '{print $1}')"
          test "$(jq -er '.result.junit_sha256' "${candidate}")" = \
            "$(sha256sum candidate-evidence/junit.xml | awk '{print $1}')"
          diff -u \
            <(jq -S . baseline-evidence/image-metadata.json) \
            <(jq -S . candidate-evidence/image-metadata.json)

          patch_metadata=patch-evidence/run-metadata.json
          patch_selection=patch-evidence/selection.json
          patch_validation=patch-evidence/validation.json
          test -s "${patch_metadata}"
          test -s "${patch_selection}"
          test -s "${patch_validation}"
          test "$(jq -er '.schema' "${patch_metadata}")" = 1
          test "$(jq -er '.kind' "${patch_metadata}")" = patch-tests
          test "$(jq -er '.source.commit' "${patch_metadata}")" = \
            "${{ needs.run.outputs.source_commit }}"
          test "$(jq -er '.baseline_tests.commit' "${patch_metadata}")" = \
            "${{ needs.prepare.outputs.tests_commit }}"
          test "$(jq -er '.vm.image_id' "${patch_metadata}")" = \
            "${{ needs.prepare.outputs.gpu_image_id }}"
          test "$(jq -er '.vm.shape' "${patch_metadata}")" = \
            "${{ needs.prepare.outputs.gpu_vm_shape }}"
          test "$(jq -er '.vm.atf_profile' "${patch_metadata}")" = h200
          test "$(jq -er '.workflow.run_id' "${patch_metadata}")" = \
            "${GITHUB_RUN_ID}"
          test "$(jq -er '.workflow.run_attempt' "${patch_metadata}")" = \
            "${GITHUB_RUN_ATTEMPT}"
          test "$(jq -er '.selection.policy' "${patch_metadata}")" = \
            changed-files-on-h200-v1
          test "$(jq -er '.selection.sha256' "${patch_metadata}")" = \
            "$(sha256sum "${patch_selection}" | awk '{print $1}')"
          test "$(jq -er '.result.validation_outcome' "${patch_metadata}")" = \
            success
          jq -e '.ok == true' "${patch_validation}" >/dev/null
          jq -e \
            '(.missing_files | length) == 0 and
             (.unexpected_files | length) == 0 and
             (.non_passing | length) == 0' \
            "${patch_validation}" >/dev/null

          selected_count="$(jq -er '.selected_files | length' "${patch_selection}")"
          test "$(jq -er '.selection.files' "${patch_metadata}")" = \
            "${selected_count}"
          test "$(jq -er '.selected_files' "${patch_validation}")" = \
            "${selected_count}"
          comparison_args=(
            baseline-evidence/junit.xml
            candidate-evidence/junit.xml
            --patch-selection "${patch_selection}"
          )
          if ((selected_count > 0)); then
            test -s patch-evidence/junit.xml
            test -s patch-evidence/pytest-exit-status
            test "$(<patch-evidence/pytest-exit-status)" = 0
            test "$(jq -er '.result.pytest_exit_status' "${patch_metadata}")" = 0
            test "$(jq -er '.result.junit_sha256' "${patch_metadata}")" = \
              "$(sha256sum patch-evidence/junit.xml | awk '{print $1}')"
            comparison_args+=(--patch-junit patch-evidence/junit.xml)
          else
            jq -e \
              '.result.pytest_exit_status == null and
               .result.junit_sha256 == null' \
              "${patch_metadata}" >/dev/null
          fi

          cp "baseline-assets/${BASELINE_TAG}.json" comparison/baseline.json
          cp "${baseline}" comparison/baseline-run-metadata.json
          cp "${candidate}" comparison/candidate-run-metadata.json
          cp "${patch_metadata}" comparison/patch-run-metadata.json
          cp "${patch_selection}" comparison/patch-selection.json
          cp "${patch_validation}" comparison/patch-validation.json
          set +e
          python3 nebius/ci/atf/compare_junit.py \
            "${comparison_args[@]}" \
            --json comparison/comparison.json \
            --markdown comparison/comparison.md
          status=$?
          set -e
          cat comparison/comparison.md >>"${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - if: always()
        name: Upload the A/B comparison
        uses: actions/upload-artifact@v7
        with:
          name: slurm-atf-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: comparison/
          if-no-files-found: error
          retention-days: 30

      - if: always() && steps.comparison.outcome != 'success'
        name: Fail on a changed or incomplete test outcome
        run: |
          echo "Candidate does not match its immutable vanilla ATF baseline" >&2
          exit 1
