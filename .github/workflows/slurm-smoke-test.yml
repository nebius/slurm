name: Slurm smoke test

on:
  workflow_dispatch:
    inputs:
      nebius_cli_profile:
        description: Profile name inside NEBIUS_CLI_CONFIG
        required: true
        default: default
        type: string
      keep_vm_on_failure:
        description: Keep the VM after a failed run for SSH debugging
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: slurm-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  log-test:
    name: slurm_unit/common/log-test
    runs-on: ubuntu-24.04
    environment: e2e
    timeout-minutes: 180
    env:
      ATF_CLOUD_PROFILE: ${{ vars.SLURM_ATF_PROFILE }}
      NEBIUS_CLI_VERSION: 0.12.253
      NEBIUS_CLI_PROFILE: ${{ inputs.nebius_cli_profile }}
      NEBIUS_VM_IMAGE_ID: computeimage-e00sphs75y9ej9nw9j
      NEBIUS_VM_NAME: slurm-smoke-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout Slurm candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install yq
        uses: frenck/action-setup-yq@c4b5be8b4a215c536a41d436757d9feb92836d4f # v1.0.2
        with:
          version: v4.44.6

      - name: Resolve Nebius VM profile
        run: |
          set -euo pipefail
          if [[ -z "${ATF_CLOUD_PROFILE}" ]]; then
            echo "::error::GitHub variable SLURM_ATF_PROFILE is empty"
            exit 1
          fi
          [[ "${NEBIUS_CLI_PROFILE}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]

          value() {
            yq -er "$1" <<<"${ATF_CLOUD_PROFILE}"
          }
          emit() {
            local name="$1"
            local data="$2"
            [[ -n "${data}" && "${data}" != *$'\n'* ]]
            printf '%s=%s\n' "${name}" "${data}" >>"${GITHUB_ENV}"
          }

          project_id="$(value '.nebius_project_id')"
          subnet_id="$(value '.slurm_atf.subnet_id')"
          platform="$(value '.slurm_atf.platform')"
          preset="$(value '.slurm_atf.preset')"
          boot_disk_gib="$(value '.slurm_atf.boot_disk_gib // 512')"
          boot_disk_type="$(value '.slurm_atf.boot_disk_type // "network_ssd"')"
          ssh_user="$(value '.slurm_atf.ssh_user // "slurm-atf-ci"')"
          security_group_id="$(
            yq -r '.slurm_atf.security_group_id // ""' \
              <<<"${ATF_CLOUD_PROFILE}"
          )"

          [[ "${boot_disk_gib}" =~ ^[1-9][0-9]*$ ]]
          [[ "${ssh_user}" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]

          emit NEBIUS_PROJECT_ID "${project_id}"
          emit NEBIUS_SUBNET_ID "${subnet_id}"
          emit NEBIUS_VM_PLATFORM "${platform}"
          emit NEBIUS_VM_PRESET "${preset}"
          emit NEBIUS_VM_BOOT_DISK_GIB "${boot_disk_gib}"
          emit NEBIUS_VM_BOOT_DISK_TYPE "${boot_disk_type}"
          emit SLURM_ATF_SSH_USER "${ssh_user}"
          [[ "${security_group_id}" != *$'\n'* ]]
          printf 'NEBIUS_SECURITY_GROUP_ID=%s\n' "${security_group_id}" \
            >>"${GITHUB_ENV}"

          {
            echo "### Slurm smoke-test VM"
            echo
            echo "- Candidate: \`${GITHUB_SHA}\`"
            echo "- Image: \`${NEBIUS_VM_IMAGE_ID}\`"
            echo "- Shape: \`${platform}/${preset}\`"
            echo "- Test: \`slurm_unit/common/log-test\`"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Install Nebius CLI
        env:
          NEBIUS_INSTALL_FOLDER: ${{ github.workspace }}/bin
        run: |
          set -euo pipefail
          mkdir -p "${NEBIUS_INSTALL_FOLDER}"
          curl -sSL https://storage.eu-north1.nebius.cloud/cli/install.sh | bash
          echo "${NEBIUS_INSTALL_FOLDER}" >>"${GITHUB_PATH}"

      - name: Configure Nebius CLI
        env:
          NEBIUS_CLI_CONFIG: ${{ vars.NEBIUS_CLI_CONFIG }}
          NEBIUS_PRIVATE_KEY: ${{ secrets.NEBIUS_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEBIUS_CLI_CONFIG}"
          test -n "${NEBIUS_PRIVATE_KEY}"
          mkdir -p "${HOME}/.nebius"
          printf '%s\n' "${NEBIUS_CLI_CONFIG}" >"${HOME}/.nebius/config.yaml"
          yq -e '.profiles[strenv(NEBIUS_CLI_PROFILE)] != null' \
            "${HOME}/.nebius/config.yaml" >/dev/null
          yq -i \
            '.profiles[strenv(NEBIUS_CLI_PROFILE)]["private-key"] = strenv(NEBIUS_PRIVATE_KEY)' \
            "${HOME}/.nebius/config.yaml"
          chmod 600 "${HOME}/.nebius/config.yaml"
          nebius version --full

      - name: Prepare SSH identity
        env:
          DEBUG_SSH_PUBLIC_KEYS: ${{ secrets.SLURM_ATF_DEBUG_SSH_PUBLIC_KEYS }}
          SSH_PRIVATE_KEY: ${{ secrets.SLURM_ATF_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          private_key_file="${RUNNER_TEMP}/slurm-atf-ssh-key"
          public_key_file="${RUNNER_TEMP}/slurm-atf-ssh-key.pub"
          debug_keys_file="${RUNNER_TEMP}/slurm-atf-debug-ssh-keys.pub"
          known_hosts_file="${RUNNER_TEMP}/slurm-atf-known-hosts"
          printf '%s\n' "${SSH_PRIVATE_KEY}" | tr -d '\r' >"${private_key_file}"
          chmod 600 "${private_key_file}"
          ssh-keygen -y -P "" -f "${private_key_file}" >"${public_key_file}"
          printf '%s\n' "${DEBUG_SSH_PUBLIC_KEYS}" | tr -d '\r' >"${debug_keys_file}"
          chmod 600 "${debug_keys_file}"
          touch "${known_hosts_file}"
          chmod 600 "${known_hosts_file}"
          {
            echo "SLURM_ATF_SSH_PRIVATE_KEY_FILE=${private_key_file}"
            echo "SLURM_ATF_SSH_PUBLIC_KEY_FILE=${public_key_file}"
            echo "SLURM_ATF_DEBUG_SSH_PUBLIC_KEYS_FILE=${debug_keys_file}"
            echo "SLURM_ATF_SSH_KNOWN_HOSTS_FILE=${known_hosts_file}"
          } >>"${GITHUB_ENV}"

      - id: create_vm
        name: Create disposable Nebius VM
        run: |
          set -euo pipefail
          instance_json="$(nebius/ci/cloud/nebius/create-vm.sh)"
          vm_id="$(jq -er '.metadata.id' <<<"${instance_json}")"
          echo "NEBIUS_VM_ID=${vm_id}" >>"${GITHUB_ENV}"
          echo "vm_id=${vm_id}" >>"${GITHUB_OUTPUT}"

      - id: wait_vm
        name: Wait for cloud-init and SSH
        run: |
          set -euo pipefail
          public_ip="$(nebius/ci/cloud/nebius/wait-for-ssh.sh)"
          echo "NEBIUS_VM_PUBLIC_IP=${public_ip}" >>"${GITHUB_ENV}"
          echo "public_ip=${public_ip}" >>"${GITHUB_OUTPUT}"
          {
            echo "- VM ID: \`${NEBIUS_VM_ID}\`"
            echo "- Public IP: \`${public_ip}\`"
            echo "- SSH: \`ssh ${SLURM_ATF_SSH_USER}@${public_ip}\`"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Copy candidate source to the VM
        run: |
          set -euo pipefail
          remote_root="/home/${SLURM_ATF_SSH_USER}/slurm-smoke"
          tar --exclude='./.git' --exclude='./smoke-result' -czf - . |
            ssh \
              -i "${SLURM_ATF_SSH_PRIVATE_KEY_FILE}" \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=6 \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=${SLURM_ATF_SSH_KNOWN_HOSTS_FILE}" \
              "${SLURM_ATF_SSH_USER}@${NEBIUS_VM_PUBLIC_IP}" \
              "mkdir -p '${remote_root}/source' && tar -xzf - -C '${remote_root}/source'"

      - id: smoke_test
        name: Build candidate and run log-test
        continue-on-error: true
        run: |
          set -euo pipefail
          remote_root="/home/${SLURM_ATF_SSH_USER}/slurm-smoke"
          ssh \
            -i "${SLURM_ATF_SSH_PRIVATE_KEY_FILE}" \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=${SLURM_ATF_SSH_KNOWN_HOSTS_FILE}" \
            "${SLURM_ATF_SSH_USER}@${NEBIUS_VM_PUBLIC_IP}" \
            bash -s -- "${remote_root}" <<'REMOTE'
          set -euo pipefail
          root="$1"
          source_dir="${root}/source"
          build_dir="${root}/build"
          result_dir="${root}/result"
          pmix_prefix=/opt/slurm-atf/pmix/5.0.11
          bpf_root=/usr

          mkdir -p "${build_dir}" "${result_dir}"
          exec > >(tee "${result_dir}/smoke-test.log") 2>&1

          collect_logs() {
            status=$?
            if [[ -f "${build_dir}/config.log" ]]; then
              cp "${build_dir}/config.log" "${result_dir}/config.log"
            fi
            find "${build_dir}/testsuite/slurm_unit/common" \
              -maxdepth 1 -type f \
              \( -name 'test-suite.log' -o -name '*.log' \) \
              -exec cp {} "${result_dir}/" \; 2>/dev/null || true
            printf '%s\n' "${status}" >"${result_dir}/exit-status"
            exit "${status}"
          }
          trap collect_logs EXIT

          sudo test -f /etc/slurm-atf-disposable
          test -s /etc/slurm-atf-image.json
          test -x "${pmix_prefix}/bin/pmix_info"
          test -x "${source_dir}/configure"

          kernel_bpf_header="/usr/src/linux-headers-$(uname -r)/include/uapi/linux/bpf.h"
          if [[ -f "${kernel_bpf_header}" ]] &&
             grep -q BPF_TOKEN_CREATE "${kernel_bpf_header}"; then
            bpf_root=/opt/slurm-atf/kernel-uapi
            sudo install -D -m 0644 "${kernel_bpf_header}" \
              "${bpf_root}/include/linux/bpf.h"
          fi

          cd "${build_dir}"
          PKG_CONFIG_PATH="${pmix_prefix}/lib/pkgconfig" \
          CPPFLAGS="-I${bpf_root}/include" \
            "${source_dir}/configure" \
              --prefix=/opt/slurm-atf/install \
              --sysconfdir=/opt/slurm-atf/install/etc \
              --localstatedir=/var/lib/slurm-atf \
              --runstatedir=/run/slurm-atf \
              --enable-multiple-slurmd \
              --with-pmix="${pmix_prefix}" \
              --with-json=/usr \
              --with-jwt=/usr \
              --with-yaml=/usr \
              --with-lz4=/usr \
              --with-hwloc=/usr \
              --with-bpf="${bpf_root}" \
              CFLAGS='-O2 -g3 -fno-omit-frame-pointer'

          make -j"$(nproc)"
          make -C testsuite/slurm_unit/common check TESTS=log-test
          REMOTE

      - if: always() && steps.wait_vm.outcome == 'success'
        name: Collect smoke-test logs
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p smoke-result
          remote_result="/home/${SLURM_ATF_SSH_USER}/slurm-smoke/result/."
          scp \
            -i "${SLURM_ATF_SSH_PRIVATE_KEY_FILE}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=${SLURM_ATF_SSH_KNOWN_HOSTS_FILE}" \
            -r "${SLURM_ATF_SSH_USER}@${NEBIUS_VM_PUBLIC_IP}:${remote_result}" \
            smoke-result/ || true

      - if: always() && steps.create_vm.outcome != 'skipped'
        name: Delete disposable Nebius VM
        env:
          KEEP_VM_ON_FAILURE: ${{ inputs.keep_vm_on_failure }}
          SMOKE_TEST_OUTCOME: ${{ steps.smoke_test.outcome }}
        run: |
          set -euo pipefail
          if [[ "${KEEP_VM_ON_FAILURE}" == true && "${SMOKE_TEST_OUTCOME}" != success ]]; then
            {
              echo
              echo "> [!WARNING]"
              echo "> VM kept because the test failed and keep_vm_on_failure=true."
              echo "> Delete \`${NEBIUS_VM_NAME}\` manually after debugging."
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          nebius/ci/cloud/nebius/delete-vm.sh

      - if: always()
        name: Upload smoke-test logs
        uses: actions/upload-artifact@v7
        with:
          name: slurm-log-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: smoke-result/
          if-no-files-found: warn
          retention-days: 14

      - if: always() && steps.smoke_test.outcome != 'success'
        name: Fail after log collection and cleanup
        run: |
          echo "slurm_unit/common/log-test did not complete successfully" >&2
          exit 1
