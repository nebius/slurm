# Disposable single-host Slurm ATF cluster: physical 8xH200 profile.
ClusterName=atf-cluster
SlurmctldHost=localhost
SlurmUser=slurm

AuthType=auth/munge
CredType=cred/munge
AuthAltParameters=jwt_key=/opt/slurm-atf/install/etc/jwt_hs256.key
PluginDir=/opt/slurm-atf/install/lib/slurm
MpiDefault=none

SlurmctldPort=6817
SlurmdPort=6818
SlurmctldPidFile=/run/slurm-atf/slurmctld.pid
SlurmdPidFile=/run/slurm-atf/slurmd-%n.pid
SlurmctldLogFile=/var/log/slurm-atf/slurmctld.log
SlurmdLogFile=/var/log/slurm-atf/slurmd.%n.log
SlurmSchedLogFile=/var/log/slurm-atf/slurmsched.log
StateSaveLocation=/var/lib/slurm-atf/slurmctld
SlurmdSpoolDir=/var/lib/slurm-atf/slurmd/%n
TmpFS=/tmp/slurm-%n

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
SlurmdParameters=config_overrides
ReturnToService=1
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity
JobAcctGatherType=jobacct_gather/cgroup
JobAcctGatherFrequency=task=30
PropagateResourceLimitsExcept=MEMLOCK

SlurmctldDebug=debug3
SlurmdDebug=debug5
DebugFlags=MPI,Reservation

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=localhost

GresTypes=gpu

# ATF clones this template into node1, node2, ... and increments Port.
NodeName=node0 NodeAddr=127.0.0.1 Port=7001 CPUs=128 Boards=1 SocketsPerBoard=2 CoresPerSocket=32 ThreadsPerCore=2 RealMemory=1500000 Gres=gpu:nvidia_h200:8 State=UNKNOWN
PartitionName=primary Nodes=ALL Default=YES MaxTime=INFINITE State=UP DefMemPerCPU=1024
